# ci-template-version: 1.2
name: Python tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        default: '3.12'
      coverage-threshold:
        description: Minimum coverage percentage
        type: number
        default: 80
      working-directory:
        description: Directory containing pyproject.toml
        type: string
        default: '.'
      runner:
        description: >-
          Runner label to execute on. Defaults to the GitHub-hosted runner.
          Set to 'atlas-self-hosted' to run on the Atlas self-hosted runner
          fleet. See .atlas/axioms/self-hosted-runner-rollout.md in the Atlas
          workspace before opting a galaxy in.
        type: string
        default: 'ubuntu-latest'

jobs:
  test:
    name: pytest + coverage
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: luukjuh123/gitops-templates/.github/actions/setup-python@main
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Run pytest
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ inputs.coverage-threshold }} \
            -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
