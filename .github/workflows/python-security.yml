# ci-template-version: 1.2
name: Python security scan

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing pyproject.toml
        type: string
        default: '.'
      runner:
        description: >-
          Runner label to execute on. Defaults to the GitHub-hosted runner.
          Set to 'atlas-self-hosted' to run on the Atlas self-hosted runner
          fleet. See .atlas/axioms/self-hosted-runner-rollout.md in the Atlas
          workspace before opting a galaxy in.
        type: string
        default: 'ubuntu-latest'

jobs:
  bandit:
    name: bandit (SAST)
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bandit
        run: pip install "bandit[toml]"
      - name: Run bandit
        run: bandit -r src/ -c pyproject.toml -ll

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit and uv
        run: pip install pip-audit uv
      - name: Export dependencies and audit
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --desc --progress-spinner off
